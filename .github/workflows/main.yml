name: Обновить календарь ВГИКа

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Подключить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Собрать календарь
        run: node scripts/generate-calendar.mjs

      - name: Сохранить обновление
        run: |
          if git diff --quiet -- public/calendar.ics; then
            echo "Расписание не изменилось"
            exit 0
          fi
          git config user.name "VGIK Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/calendar.ics
          git commit -m "Обновить расписание ВГИКа"
          git push
